id: s2-011-pair-sum-quadratic
title: 是否存在两数之和等于目标（大数据）
statement: |
  第一行输入 n 和目标值 target（1 <= n <= 200000），
  第二行输入 n 个整数。若存在两个不同位置的数之和等于 target 输出 YES，
  否则输出 NO。
knowledge_tags:
  - 复杂度分析
  - 哈希
difficulty: medium
expected_root_cause: wrong_complexity
observable_verdict: TLE
notes: |
  双重循环是 O(n^2)，n=2e5 时约 2e10 次操作，远超时限。
  逻辑本身正确（暴力枚举两两组合），所以小用例 AC、大用例 TLE。
  根因是复杂度而非正确性。
wrong_code: |
  #include <iostream>
  #include <vector>
  using namespace std;
  int main() {
      int n;
      long long target;
      cin >> n >> target;
      vector<long long> a(n);
      for (int i = 0; i < n; i++) cin >> a[i];
      for (int i = 0; i < n; i++) {
          for (int j = i + 1; j < n; j++) {
              if (a[i] + a[j] == target) {
                  cout << "YES" << endl;
                  return 0;
              }
          }
      }
      cout << "NO" << endl;
      return 0;
  }
correct_code: |
  #include <iostream>
  #include <vector>
  #include <unordered_set>
  using namespace std;
  int main() {
      int n;
      long long target;
      cin >> n >> target;
      vector<long long> a(n);
      for (int i = 0; i < n; i++) cin >> a[i];
      unordered_set<long long> seen;
      for (int i = 0; i < n; i++) {
          if (seen.count(target - a[i])) {
              cout << "YES" << endl;
              return 0;
          }
          seen.insert(a[i]);
      }
      cout << "NO" << endl;
      return 0;
  }
test_cases:
  - input: "4 9\n2 7 11 15\n"
    expected_output: "YES\n"
  - input: "3 10\n1 2 3\n"
    expected_output: "NO\n"
