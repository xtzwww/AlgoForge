id: s2-012-binary-search-boundary
title: 二分查找目标值下标
statement: |
  第一行输入 n 和 target，第二行输入 n 个严格递增的整数。
  输出 target 的下标（0-based），不存在输出 -1。
knowledge_tags:
  - 二分查找
  - 循环边界
difficulty: medium
expected_root_cause: off_by_one
observable_verdict: WA
notes: |
  `hi = n - 1` 但循环条件写成 `while (lo < hi)`。当区间收缩到只剩一个
  元素时循环提前退出，而该元素从未被检查：只要 target 落在最后一次
  `lo == hi` 停留的位置上就会漏判。例如 `[1,3,5,7,9]` 查 9 时返回 -1。
wrong_code: |
  #include <iostream>
  #include <vector>
  using namespace std;
  int main() {
      int n;
      long long target;
      cin >> n >> target;
      vector<long long> a(n);
      for (int i = 0; i < n; i++) cin >> a[i];
      int lo = 0, hi = n - 1, ans = -1;
      while (lo < hi) {
          int mid = (lo + hi) / 2;
          if (a[mid] == target) { ans = mid; break; }
          else if (a[mid] < target) lo = mid + 1;
          else hi = mid - 1;
      }
      cout << ans << endl;
      return 0;
  }
correct_code: |
  #include <iostream>
  #include <vector>
  using namespace std;
  int main() {
      int n;
      long long target;
      cin >> n >> target;
      vector<long long> a(n);
      for (int i = 0; i < n; i++) cin >> a[i];
      int lo = 0, hi = n - 1, ans = -1;
      while (lo <= hi) {
          int mid = lo + (hi - lo) / 2;
          if (a[mid] == target) { ans = mid; break; }
          else if (a[mid] < target) lo = mid + 1;
          else hi = mid - 1;
      }
      cout << ans << endl;
      return 0;
  }
test_cases:
  - input: "5 9\n1 3 5 7 9\n"
    expected_output: "4\n"
  - input: "5 1\n1 3 5 7 9\n"
    expected_output: "0\n"
  - input: "4 5\n2 4 6 8\n"
    expected_output: "-1\n"
