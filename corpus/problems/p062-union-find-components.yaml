id: p062-union-find-components
title: 并查集（动态连通性）
knowledge_tags:
  - 并查集
  - 图论
  - 数据结构
difficulty: medium
source: 经典算法题
description: |
  初始时有 $n$ 个孤立的结点，编号为 $1$ 到 $n$。
  接下来有 $q$ 条操作，操作只有两种：

  - `1 u v` —— 把结点 $u$ 和结点 $v$ 所在的**连通块合并**；
  - `2 u v` —— 询问结点 $u$ 和结点 $v$ 当前**是否连通**。

  对每条 `2` 操作，输出一行 `YES`（连通）或 `NO`（不连通）。
  请注意：$u$ 和 $v$ 相同时也算连通。

  **输入格式**

  第一行两个整数 $n$ 和 $q$，以空格分隔。
  接下来 $q$ 行，每行三个整数 $op$、$u$、$v$。

  **输出格式**

  按顺序，为每条 `2` 操作输出一行 `YES` 或 `NO`。

  **数据范围**

  $1 \le n \le 10^5$，$1 \le q \le 10^5$，
  $1 \le u, v \le n$

  **说明**

  合并操作可能重复给出一条已经连通的边，这是允许的。
input_format: 第一行 n 和 q，接下来 q 行每行 op、u、v。
output_format: 按顺序为每条 2 操作输出一行 YES 或 NO。
time_limit: 2.0
memory_limit: 256

test_cases:
  - input: "5 6\n2 1 2\n1 1 2\n2 1 2\n1 2 3\n2 1 3\n2 4 5\n"
    expected_output: "NO\nYES\nYES\nNO\n"
    is_sample: true
  - input: "2 3\n1 1 2\n2 1 2\n2 2 2\n"
    expected_output: "YES\nYES\n"
    is_sample: true
  - input: "1 2\n2 1 1\n2 1 1\n"
    expected_output: "YES\nYES\n"
  - input: "4 5\n1 1 2\n1 3 4\n2 1 2\n2 2 3\n2 3 4\n"
    expected_output: "YES\nNO\nYES\n"
  - input: "3 4\n1 1 2\n1 1 2\n2 1 2\n2 1 3\n"
    expected_output: "YES\nNO\n"
  - input: "4 3\n2 1 1\n1 1 1\n2 1 1\n"
    expected_output: "YES\nYES\n"

correct_reference: |
  #include <iostream>
  #include <vector>
  #include <numeric>
  using namespace std;

  vector<int> parent, rnk;

  // Path compression: every node on the walk points straight at the
  // root afterwards, which is what keeps later queries near O(1).
  int find(int x) {
      while (parent[x] != x) {
          parent[x] = parent[parent[x]];
          x = parent[x];
      }
      return x;
  }

  void unite(int a, int b) {
      a = find(a);
      b = find(b);
      if (a == b) return;      // already connected: nothing to merge
      if (rnk[a] < rnk[b]) swap(a, b);
      parent[b] = a;
      if (rnk[a] == rnk[b]) ++rnk[a];
  }

  int main() {
      ios::sync_with_stdio(false);
      cin.tie(nullptr);
      int n, q;
      cin >> n >> q;
      parent.resize(n + 1);
      rnk.assign(n + 1, 0);
      iota(parent.begin(), parent.end(), 0);

      while (q--) {
          int op, u, v;
          cin >> op >> u >> v;
          if (op == 1) {
              unite(u, v);
          } else {
              // u == v is trivially connected — find(u) == find(v)
              // already covers it, but saying so explicitly avoids the
              // "have to be two different nodes" misreading.
              cout << (find(u) == find(v) ? "YES" : "NO") << '\n';
          }
      }
      return 0;
  }
eval_notes: |
  并查集模板很短，但有两处"能在样例上通过、在别的数据上退化"的
  写法，值得单独收进题库。

  第一类错误是**完全不做路径压缩**（`find` 直接
  `while (parent[x] != x) x = parent[x];`）。答案全对，
  但合并成一棵链之后每次查询是 $O(n)$，$q = 10^5$ 时
  $10^{10}$ 次操作，必然超时。这类错误的表现是**小数据全对、
  大数据 TLE**，而且随 $n$ 增长得非常陡。错因标签：
  wrong_complexity。

  第二类错误是**合并时不比较秩/大小，永远把 `b` 接到 `a` 上**。
  同样答案正确但树退化成链。错因标签：wrong_complexity。

  第三类错误是**初始化写成 `parent[i] = 0`**（或 `parent[i] = i`
  但循环只到 `n - 1`）。前者让所有节点都指向 0，一次
  `find` 就把所有人判成连通；后者漏掉最后一个节点。
  用例 3（只有 1 个节点）专门覆盖后者。错因标签：
  uninitialized_state / off_by_one。

  第四类错误是**把 `op == 1` 的分支写成 `unite` 之外的操作**
  （例如交换 u、v 或加边计数），或者把 `op == 2` 的分支写成
  `parent[u] == parent[v]` 而**不调用 `find`**。后者只在
  "两个节点都直接挂在根上"时才正确，深层合并会给出 NO。
  错因标签：wrong_algorithm。

  第五类错误是**递归实现 `find`**：链状结构（无路径压缩时）
  深度可达 $10^5$，爆栈。错因标签：stack_overflow。

  第六类错误是**认为 $u = v$ 的询问应输出 NO**（"必须两个不同的
  节点才算连通"）。用例 3、6 专门覆盖它。错因标签：
  misread_problem。

  第七类错误是**合并时忘记先各自 `find`**（`parent[u] = v;`），
  直接把一个节点挂到另一个节点下而不挂到根上，树高增长很快。
  错因标签：wrong_traversal。
