id: p079-move-zeroes
title: 移动零（保持非零元素相对顺序）
knowledge_tags:
  - 数组
  - 双指针
  - 边界处理
difficulty: easy
source: 经典算法题
description: |
  给定一个整数数组，请把其中所有的 $0$ 移动到数组末尾，同时保持
  **非零元素的相对顺序**不变。

  **输入格式**

  第一行一个整数 $n$。
  第二行 $n$ 个整数，以空格分隔。

  **输出格式**

  一行 $n$ 个整数，表示处理后的数组，以空格分隔。

  **数据范围**

  $1 \le n \le 10^5$，$-10^9 \le a_i \le 10^9$

  **提示**

  必须**原地**思考（输出时只要结果正确即可），非零元素的先后次序
  不能改变。
input_format: 第一行 n，第二行 n 个整数。
output_format: 一行 n 个整数，0 全部移到末尾。
time_limit: 2.0
memory_limit: 256

test_cases:
  - input: "5\n0 1 0 3 12\n"
    expected_output: "1 3 12 0 0\n"
    is_sample: true
  - input: "1\n0\n"
    expected_output: "0\n"
    is_sample: true
  - input: "4\n1 2 3 4\n"
    expected_output: "1 2 3 4\n"
  - input: "3\n0 0 1\n"
    expected_output: "1 0 0\n"
  - input: "1\n5\n"
    expected_output: "5\n"
  - input: "6\n-1 0 2 0 -3 0\n"
    expected_output: "-1 2 -3 0 0 0\n"

correct_reference: |
  #include <bits/stdc++.h>
  using namespace std;
  int main() {
      ios::sync_with_stdio(false);
      cin.tie(nullptr);
      int n;
      cin >> n;
      vector<long long> a(n);
      for (int i = 0; i < n; ++i) cin >> a[i];

      // Stable partition in one pass: `write` is where the next non-zero
      // belongs. Scanning with `read` and copying only non-zeros forward
      // preserves their order for free — no swapping, which would reorder
      // them.
      int write = 0;
      for (int read = 0; read < n; ++read) {
          if (a[read] != 0) a[write++] = a[read];
      }
      // Everything from `write` onward is the zero tail.
      while (write < n) a[write++] = 0;

      for (int i = 0; i < n; ++i) {
          if (i) cout << ' ';
          cout << a[i];
      }
      cout << endl;
      return 0;
  }
eval_notes: |
  这道题的正确解法是"稳定划分"，错误大多来自用错了划分方式。

  第一类错误是**用交换（`swap`）而不是前移**。遇到零就与后面的非零
  交换，会把非零元素的相对顺序打乱（当零的个数超过 1 时尤其明显）。
  例如 `0 1 0 3 12` 用"遇零就与下一个非零交换"会得到
  `1 3 12 0 0`（碰巧对），但 `1 0 0 2 3` 会得到 `1 2 3 0 0`（也对），
  而 `0 0 1 2` 用朴素交换会得到 `1 0 2 0` —— 顺序已乱。本题样例里
  非零元素恰好递增，所以"顺序错"看起来像"顺序对"，这是题目设计上
  有意留的一点模糊；真正会暴露的是非零元素**非单调**的输入。
  错因标签：wrong_algorithm。

  第二类错误是**忘记补尾部的零**。前移完成后，从 `write` 到末尾的
  位置仍是**原来的旧值**而不是 0，输出会多出重复元素。样例 1 会
  输出 `1 3 12 3 12`。这是本题最常见的一个错。错因标签：
  uninitialized_state。

  第三类错误是**判断条件写成 `a[read] > 0`** 而不是 `!= 0`。
  负数会被当成"零"移到末尾。样例 6（含 `-1`、`-3`）专门覆盖这个，
  会输出 `2 0 0 0 -1 -3` 之类。错因标签：inverted_condition。

  第四类错误是**用 `erase` + `push_back`**（遍历中删除元素）。
  在 `vector` 上逐个 `erase` 是 $O(n^2)$，且**边遍历边删会跳元素**
  ——删掉下标 $i$ 后下一个元素前移到 $i$，而 `i++` 又跳过了它，
  于是连续的零只能删掉一半。样例 4（`0 0 1`）会输出 `0 1 0`。
  错因标签：wrong_traversal。

  第五类错误是**输出时把补零写进第二个数组却忘记输出原长度**，
  输出长度变成非零个数，$n$ 个位置只输出了其中一部分。样例 5
  （单个 `5`）侥幸正确，样例 2（单个 `0`）会输出**空行**。
  错因标签：io_format_error。

  第六类错误是**用一个新数组 `res` 收集非零、再补零**。答案完全
  正确，只是用了 $O(n)$ 额外空间；输出与原地写法**完全一致**，
  本题无法区分。属等价解法。错因标签：wrong_complexity（认知层面）。

  第七类错误是**把"移动零"理解成"把零全部删除"**，输出长度变成
  非零个数。样例 1 会输出 `1 3 12`（3 个数而不是 5 个）。
  错因标签：misread_problem。
