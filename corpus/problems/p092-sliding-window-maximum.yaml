id: p092-sliding-window-maximum
title: 滑动窗口最大值（单调队列）
knowledge_tags:
  - 单调队列
  - 滑动窗口
  - 队列
  - 数据结构
difficulty: medium
source: 经典算法题
description: |
  给定一个长度为 $n$ 的整数数组和一个窗口大小 $k$。窗口从数组
  最左端开始，每次向右滑动一格，直到滑到最右端。

  请输出**每个窗口内的最大值**。

  **输入格式**

  第一行两个整数 $n$ 和 $k$。
  第二行 $n$ 个整数，以空格分隔。

  **输出格式**

  一行 $n - k + 1$ 个整数，依次为每个窗口的最大值，以空格分隔。

  **数据范围**

  $1 \le k \le n \le 10^5$，$-10^9 \le a_i \le 10^9$

  **提示**

  请尝试用**线性**复杂度完成。用堆或暴力求每个窗口的最大值，
  在本题数据规模下会超时。
input_format: 第一行 n k，第二行 n 个整数。
output_format: 一行 n-k+1 个整数，每个窗口的最大值。
time_limit: 2.0
memory_limit: 256

test_cases:
  - input: "8 3\n1 3 -1 -3 5 3 6 7\n"
    expected_output: "3 3 5 5 6 7\n"
    is_sample: true
  - input: "5 1\n1 3 2 4 5\n"
    expected_output: "1 3 2 4 5\n"
    is_sample: true
  - input: "5 5\n1 2 3 4 5\n"
    expected_output: "5\n"
  - input: "6 2\n9 8 7 6 5 4\n"
    expected_output: "9 8 7 6 5\n"
  - input: "6 3\n-1 -1 -2 -3 -1 -1\n"
    expected_output: "-1 -1 -1 -1\n"
  - input: "5 2\n1 1 1 1 1\n"
    expected_output: "1 1 1 1\n"

correct_reference: |
  #include <bits/stdc++.h>
  using namespace std;
  int main() {
      ios::sync_with_stdio(false);
      cin.tie(nullptr);
      int n, k;
      cin >> n >> k;
      vector<long long> a(n);
      for (int i = 0; i < n; ++i) cin >> a[i];

      // Deque holds indices, not values: values alone cannot tell whether
      // an element has already slid out of the window. Indices are kept in
      // decreasing order of a[i], so the front is always the max.
      deque<int> dq;
      vector<long long> ans;
      for (int i = 0; i < n; ++i) {
          // Drop the index that just left the window.
          if (!dq.empty() && dq.front() <= i - k) dq.pop_front();
          // Anything smaller than a[i] can never be the max once a[i] is
          // in the window, so it is removed from the back.
          while (!dq.empty() && a[dq.back()] <= a[i]) dq.pop_back();
          dq.push_back(i);
          if (i >= k - 1) ans.push_back(a[dq.front()]);
      }
      for (int i = 0; i < (int)ans.size(); ++i) {
          if (i) cout << ' ';
          cout << ans[i];
      }
      cout << endl;
      return 0;
  }
eval_notes: |
  单调队列的关键决定是**存下标而不是存值**，以及**弹出队尾的
  比较用不用等号**。两处都能写出"看起来对、其实错"的版本。

  第一类错误是**队列里存值而不是下标**。值无法判断"这个元素
  是否已经滑出窗口"，于是窗口滑过之后旧的最大值仍留在队首，
  一直被输出。样例 4（`9 8 7 6 5 4`、$k=2$）会输出
  `9 9 9 9 9` 而不是 `9 8 7 6 5`。这是本题最核心的一处。
  错因标签：wrong_algorithm。

  第二类错误是**弹出队尾用严格 `<`**（`a[dq.back()] < a[i]`
  而不是 `<=`）。相等的元素会被两个都留下，队首仍是正确最大值，
  所以**输出依然正确**——这两者在本题无法区分。它们的差别只在
  队列长度上。属等价写法，不构成错误。

  第三类错误是**队首过期的判断写成 `< i - k` 而不是
  `<= i - k`**。窗口左边界应当是 $i-k+1$，下标 $\le i-k$ 的
  元素已经出窗；用 `<` 会让恰好出窗的那个元素多留一轮，
  于是它可能继续充当最大值。样例 3（$k = n = 5$）侥幸
  只有一个窗口，但样例 1 会多输出一个错值。错因标签：
  off_by_one。

  第四类错误是**答案的收集时机写成 `i >= k`**。会漏掉第一个
  窗口（下标 $k-1$ 处应开始输出），输出少一个元素。以
  $n=8, k=3$ 为例应输出 6 个，写成 `i >= k` 只输出 5 个。
  错因标签：off_by_one。

  第五类错误是**用优先队列（大根堆）+ 延迟删除**。这**完全
  正确**，复杂度 $O(n \log n)$，本题 $n = 10^5$ 也能过，
  输出一致。属等价解法，无法区分。错因标签：
  wrong_complexity（认知层面，不构成判错）。

  第六类错误是**对每个窗口暴力扫描 $k$ 个元素**。复杂度
  $O(nk)$，$n = k = 10^5$ 时是 $10^{10}$，必然 TLE。
  这是本题主要的超时来源。错因标签：wrong_complexity。

  第七类错误是**把"窗口内最大值"理解成"前缀最大值"**，
  一路取 $\max$。样例 4（递减数组）会输出
  `9 9 9 9 9` 而不是 `9 8 7 6 5`。错因标签：misread_problem。
