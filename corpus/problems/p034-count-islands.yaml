id: p034-count-islands
title: 岛屿数量
knowledge_tags:
  - 图论
  - 深度优先搜索
  - 广度优先搜索
  - 二维网格
difficulty: medium
source: 经典算法题
description: |
  给定一个 $n \times m$ 的网格，`1` 表示陆地，`0` 表示水域。

  **上下左右**相邻的陆地属于同一座岛屿，斜对角相邻**不算**相邻。

  请统计岛屿的数量。

  **输入格式**

  第一行两个整数 $n$ 和 $m$。
  接下来 $n$ 行，每行 $m$ 个字符，由 `0` 和 `1` 组成。

  **输出格式**

  一行，一个整数，表示岛屿数量。

  **数据范围**

  $1 \le n, m \le 100$
input_format: 第一行 n 和 m，接下来 n 行每行 m 个 0/1 字符。
output_format: 一行一个整数，岛屿数量。
time_limit: 2.0
memory_limit: 256

test_cases:
  - input: "4 5\n11000\n11000\n00100\n00011\n"
    expected_output: "3\n"
    is_sample: true
  - input: "2 2\n10\n01\n"
    expected_output: "2\n"
    is_sample: true
  - input: "3 3\n111\n111\n111\n"
    expected_output: "1\n"
  - input: "2 2\n11\n11\n"
    expected_output: "1\n"
  - input: "1 1\n0\n"
    expected_output: "0\n"
  - input: "3 3\n101\n010\n101\n"
    expected_output: "5\n"
  - input: "1 5\n10101\n"
    expected_output: "3\n"

correct_reference: |
  #include <iostream>
  #include <vector>
  #include <string>
  #include <queue>
  using namespace std;
  int main() {
      ios::sync_with_stdio(false);
      cin.tie(nullptr);
      int n, m;
      cin >> n >> m;
      vector<string> g(n);
      for (int i = 0; i < n; ++i) cin >> g[i];

      int islands = 0;
      int dr[4] = {-1, 1, 0, 0};
      int dc[4] = {0, 0, -1, 1};

      for (int i = 0; i < n; ++i) {
          for (int j = 0; j < m; ++j) {
              if (g[i][j] != '1') continue;
              ++islands;
              // Flood fill: every cell of this island is marked as
              // water so the outer scan never starts here again.
              queue<pair<int, int>> q;
              q.push({i, j});
              g[i][j] = '0';
              while (!q.empty()) {
                  auto [r, c] = q.front();
                  q.pop();
                  for (int d = 0; d < 4; ++d) {
                      int nr = r + dr[d];
                      int nc = c + dc[d];
                      if (nr < 0 || nr >= n || nc < 0 || nc >= m) continue;
                      if (g[nr][nc] != '1') continue;
                      g[nr][nc] = '0';
                      q.push({nr, nc});
                  }
              }
          }
      }
      cout << islands << endl;
      return 0;
  }
eval_notes: |
  本题是"搜索类题目标记时机写错"这一大类错误的教科书样本，
  而且几个错误的表现各不相同、很好区分。

  第一类错误是**入队时不标记、出队时才标记**。同一层（或不同层）
  的多个格子可能同时把同一个格子加入队列，于是这个格子会被
  处理多次。对于"求岛屿数量"这个问题，重复处理不会改变答案，
  所以程序**看起来完全正确**，只是在大网格上多花了时间——
  这正是最值得放进题库的一类：**错误不产生错误答案，
  而把复杂度从 $O(nm)$ 变成了更差的规模**。错因标签：
  wrong_complexity。

  第二类错误是**忘记标记起始格**：只标记了邻居，起始格保持 `1`。
  如果搜索逻辑依赖"格子被标记后才会被访问"，起始格会被外层
  扫描重复选中，岛屿数量被高估。错因标签：uninitialized_state。

  第三类错误是**把斜对角也算作相邻**：$3 \times 3$ 的
  `101 / 010 / 101` 会被判成 1 座岛（正确答案是 5）。
  错因标签：misread_problem。

  第四类错误是**只检查了四个方向里的两个**（例如只检查右和下），
  这在"标记整个连通块"的写法下会让部分连通块被拆成多座岛屿。
  错因标签：wrong_traversal。

  第五类错误是**把网格读成一维字符串或按行 `cin >> s` 后又按
  列访问**，导致行列颠倒。$2 \times 2$ 的对角用例会暴露它。
  错因标签：io_format_error。

  第六类错误是**递归 DFS 在大网格上爆栈**：$100 \times 100$ 的
  全陆地网格深度可达 $10^4$ 层，C++ 默认栈通常能撑住，
  但同样的代码在更大网格上会段错误。本题数据范围内不暴露，
  属于"能过但不稳"的写法，用 BFS 可彻底避免。错因标签：
  wrong_complexity / stack_overflow。
