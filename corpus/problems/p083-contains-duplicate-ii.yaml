id: p083-contains-duplicate-ii
title: 存在重复元素 II（下标距离不超过 k）
knowledge_tags:
  - 哈希表
  - 滑动窗口
  - 数组
difficulty: easy
source: 经典算法题
description: |
  给定一个整数数组和一个整数 $k$，请判断数组中是否存在两个**不同的
  下标** $i$ 和 $j$，使得 $a_i = a_j$ 且 $|i - j| \le k$。

  **输入格式**

  第一行两个整数 $n$ 和 $k$。
  第二行 $n$ 个整数，以空格分隔。

  **输出格式**

  一行，若存在这样的两个下标输出 `1`，否则输出 `0`。

  **数据范围**

  $1 \le n \le 10^5$，$0 \le k \le 10^5$，$-10^9 \le a_i \le 10^9$

  **提示**

  $k = 0$ 时，要求两个下标**距离不超过 0**，即 $i = j$；但题目
  要求 $i$ 与 $j$ 是**不同**的下标，所以 $k = 0$ 时答案恒为 `0`。
input_format: 第一行 n k，第二行 n 个整数。
output_format: 一行输出 1（存在）或 0（不存在）。
time_limit: 2.0
memory_limit: 256

test_cases:
  - input: "4 3\n1 2 3 1\n"
    expected_output: "1\n"
    is_sample: true
  - input: "5 2\n1 2 3 1 4\n"
    expected_output: "0\n"
    is_sample: true
  - input: "3 0\n1 1 1\n"
    expected_output: "0\n"
  - input: "4 1\n1 2 3 1\n"
    expected_output: "0\n"
  - input: "6 2\n1 2 1 3 1 2\n"
    expected_output: "1\n"
  - input: "5 10\n-1 -2 -3 -4 -1\n"
    expected_output: "1\n"
  - input: "4 5\n7 7 7 7\n"
    expected_output: "1\n"

correct_reference: |
  #include <bits/stdc++.h>
  using namespace std;
  int main() {
      ios::sync_with_stdio(false);
      cin.tie(nullptr);
      int n;
      long long k;
      cin >> n >> k;
      vector<long long> a(n);
      for (int i = 0; i < n; ++i) cin >> a[i];

      // lastSeen[v] = most recent index holding v. Keeping only the most
      // recent one is enough: if any earlier copy were within k, the
      // nearest one certainly is.
      unordered_map<long long, int> lastSeen;
      for (int i = 0; i < n; ++i) {
          auto it = lastSeen.find(a[i]);
          if (it != lastSeen.end() && i - it->second <= k) {
              cout << 1 << endl;
              return 0;
          }
          lastSeen[a[i]] = i;
      }
      cout << 0 << endl;
      return 0;
  }
eval_notes: |
  这题看起来是哈希表的入门题，但"距离不超过 k"这个约束让窗口的
  维护方式成了真正的考点。

  第一类错误是**把距离条件写成 `< k`**（漏掉等号）。样例 1
  （`1 2 3 1`、$k=3$，下标 0 与 3 距离正好 3）会输出 0
  而不是 1。这是最典型的一处。错因标签：inverted_condition。

  第二类错误是**不记录下标、只记录"存在过"**（用 `unordered_set`
  判断有没有出现过）。这样完全丢掉了距离信息，只要数组里存在任何
  重复就输出 1。样例 2（`1 2 3 1 4`、$k=2$）里两个 `1` 相距 3，
  正确答案 0，这种写法会错成 1。样例 2 专门覆盖这个。
  错因标签：wrong_algorithm。

  第三类错误是**记录的是"第一次出现的下标"而不是"最近一次"**。
  若有三个相同元素，最近的那个才可能满足距离约束；只留第一次会
  高估距离。以 `1 2 1 3 1`、$k=2$ 为例：下标 2 与 4 距离 2 满足，
  但若只记第一次（下标 0），距离 4 不满足，会漏判。错因标签：
  wrong_algorithm。

  第四类错误是**维护一个大小为 $k$ 的滑动窗口集合，但窗口更新顺序
  写错**（先移除 $i-k$ 再判断，或先判断再移除）。若先移除再判断，
  恰好距离为 $k$ 的那一对会被漏掉（把下标 $i-k$ 的元素删了才去
  比对），样例 1 会输出 0。错因标签：off_by_one。

  第五类错误是**没处理 $k = 0$**。题目要求 $i \ne j$，所以
  $k = 0$ 时恒为 0；若实现里用"距离 $\le k$"且把同一个下标
  也算进来（例如窗口包含自己），会输出 1。样例 3 专门覆盖这个。
  错因标签：boundary_condition。

  第六类错误是**对每个元素向前扫描 $k$ 个**（$O(nk)$ 朴素法）。
  答案正确，但 $n = k = 10^5$ 时是 $10^{10}$ 次比较，必然 TLE。
  这是本题最主要的超时来源。错因标签：wrong_complexity。

  第七类错误是**用 `unordered_map<long long,int>` 但用 `[]` 访问
  来判断存在性**（`if (lastSeen.count(a[i]))` 写成
  `if (lastSeen[a[i]])`）。`operator[]` 会把不存在的键**插入**
  并初始化为 0，于是下标 0 的元素会被误判成"上一次出现在 0"，
  进而在 $i = 0$ 时自我匹配。样例 7（全 7）侥幸正确，
  但样例 5 会提前误报。错因标签：uninitialized_state。
