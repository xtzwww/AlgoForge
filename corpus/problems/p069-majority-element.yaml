id: p069-majority-element
title: 多数元素（出现次数超过一半）
knowledge_tags:
  - 数组
  - 计数
  - 贪心
  - 复杂度分析
difficulty: medium
source: 经典算法题
description: |
  给定一个长度为 $n$ 的整数数组。已知其中存在一个元素，
  它的出现次数**严格大于** $n / 2$（向下取整后仍大于，
  即出现次数 $\ge \lfloor n/2 \rfloor + 1$）。

  请找出这个元素。

  **输入格式**

  第一行一个整数 $n$。
  第二行 $n$ 个整数 $a_1, a_2, \dots, a_n$，以空格分隔。

  **输出格式**

  一行，一个整数，表示多数元素。

  **数据范围**

  $1 \le n \le 10^5$，$|a_i| \le 10^9$，
  保证多数元素存在

  **提示**

  出现次数**恰好等于** $n / 2$ 的元素**不算**多数元素。
  例如 $n = 4$、数组为 `1 1 2 2` 时不存在多数元素，
  这类输入不会出现在数据里。
input_format: 第一行 n，第二行 n 个整数。
output_format: 一行一个整数，多数元素。
time_limit: 2.0
memory_limit: 256

test_cases:
  - input: "3\n3 2 3\n"
    expected_output: "3\n"
    is_sample: true
  - input: "1\n7\n"
    expected_output: "7\n"
    is_sample: true
  - input: "7\n2 2 1 1 1 2 2\n"
    expected_output: "2\n"
  - input: "4\n1 1 1 2\n"
    expected_output: "1\n"
  - input: "7\n5 5 5 5 1 2 3\n"
    expected_output: "5\n"
  - input: "3\n-1 -1 -1\n"
    expected_output: "-1\n"
  - input: "6\n9 1 9 1 9 9\n"
    expected_output: "9\n"

correct_reference: |
  #include <iostream>
  using namespace std;
  int main() {
      ios::sync_with_stdio(false);
      cin.tie(nullptr);
      int n;
      cin >> n;

      // Boyer-Moore majority vote: keep a candidate and a balance.
      // A different value cancels one occurrence of the candidate.
      // Because the majority element occurs more than n/2 times it
      // cannot be fully cancelled, so it survives as the candidate.
      long long candidate = 0;
      long long balance = 0;
      for (int i = 0; i < n; ++i) {
          long long x;
          cin >> x;
          if (balance == 0) {
              candidate = x;
              balance = 1;
          } else if (x == candidate) {
              ++balance;
          } else {
              --balance;
          }
      }
      cout << candidate << endl;
      return 0;
  }
eval_notes: |
  这是一道"算法本身很聪明"的题，因此错误往往不是写错了公式，
  而是**没有意识到该算法的前提**。

  第一类错误是**用 Boyer-Moore 但忽略了"多数元素必定存在"这个
  前提**。该算法在多数元素**不存在**时返回的是一个"候选"
  而不是答案：`1 2 3` 会返回 3（最后一次把 balance 清零的值），
  而正确答案是"不存在"。本题保证存在，所以这类错误
  在本题数据下**不可能暴露**——这是题目设计上有意接受的一处
  不可观测性，应当写在注释里而不是假装它不存在。
  错因标签：missing_case。

  第二类错误是**把 `balance == 0` 的判断放在比较之后**，
  这样第一个元素不会被设为候选，或者候选在 balance 归零时
  没有被换掉，结果取决于第一次归零时读到的是哪个数。
  错因标签：wrong_traversal。

  第三类错误是**把"多数"的条件写成 `>= n / 2`**
  （即认为恰好一半也算）。这在 $n$ 为偶数时会把
  `1 1 2 2` 判成有多数元素，但本题保证多数元素存在，
  所以只影响边界认知，不影响本题输出。错因标签：
  inverted_condition。

  第四类错误是**用哈希表计数但只统计"出现过的值"**，
  忘记在清零（balance == 0）时更新候选以外的信息——
  具体表现为：有人先用哈希表算完所有计数，再取最大的那个，
  这在本题里**总是正确**（因为多数元素存在，它必然是计数最大
  的值），于是 $O(n)$ 的哈希解法与 $O(1)$ 空间的做法在本
  题里无法区分。错因标签：wrong_complexity（指空间）。

  第五类错误是**排序后取中间元素 `a[n/2]`**。这道题的多数
  元素一定占据中间位置，所以也总是正确——**本题无法区分
  这三种解法**，这三点（哈希、排序、投票）应当作为"等价解法"
  写进笔记，而不是宣判某一种为错。真正会被判错的是
  "取出现次数最多的元素"实现里**排序比较函数写错**导致
  次大值跑到中间。错因标签：wrong_algorithm。

  第六类错误是**把 `candidate` 初始化为 0 并直接输出**：
  输入保证 $n \ge 1$，所以循环一定会给 `candidate` 赋值；
  但若实现里把"balance 归零"的分支写成只改候选不重置 balance，
  最终 balance 可能停在 0 上，此时输出的是最后一次的候选，
  恰好仍正确。错因标签：uninitialized_state。
