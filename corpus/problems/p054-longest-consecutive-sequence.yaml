id: p054-longest-consecutive-sequence
title: 最长连续序列
knowledge_tags:
  - 哈希表
  - 数组
  - 复杂度分析
difficulty: medium
source: 经典算法题
description: |
  给定一个长度为 $n$ 的整数数组，请找出其中**最长的一段连续整数序列**
  的长度。

  连续整数序列是指形如 $x, x+1, x+2, \dots$ 的一组数，
  它们只需要在数组中**出现过**，不要求相邻，也不要求顺序。
  重复出现的数只算一次。

  **输入格式**

  第一行一个整数 $n$。
  第二行 $n$ 个整数 $a_1, a_2, \dots, a_n$，以空格分隔。

  **输出格式**

  一行，一个整数，表示最长连续序列的长度。

  **数据范围**

  $1 \le n \le 10^5$，$|a_i| \le 10^9$
input_format: 第一行 n，第二行 n 个整数。
output_format: 一行一个整数，最长连续序列长度。
time_limit: 2.0
memory_limit: 256

test_cases:
  - input: "6\n100 4 200 1 3 2\n"
    expected_output: "4\n"
    is_sample: true
  - input: "10\n0 3 7 2 5 8 4 6 0 1\n"
    expected_output: "9\n"
    is_sample: true
  - input: "1\n5\n"
    expected_output: "1\n"
  - input: "5\n5 5 5 5 5\n"
    expected_output: "1\n"
  - input: "5\n1 2 3 4 5\n"
    expected_output: "5\n"
  - input: "6\n-3 -2 -1 0 1 2\n"
    expected_output: "6\n"
  - input: "4\n10 5 12 3\n"
    expected_output: "1\n"

correct_reference: |
  #include <iostream>
  #include <vector>
  #include <unordered_set>
  #include <algorithm>
  using namespace std;
  int main() {
      ios::sync_with_stdio(false);
      cin.tie(nullptr);
      int n;
      cin >> n;
      vector<long long> a(n);
      // A set, not a multiset: duplicates in the input must not inflate
      // the answer, since "5 5 5 5 5" has consecutive run length 1.
      unordered_set<long long> s;
      s.reserve(n * 2);
      for (int i = 0; i < n; ++i) {
          cin >> a[i];
          s.insert(a[i]);
      }

      int best = 0;
      for (long long x : s) {
          // Only start counting from the beginning of a run: if x - 1 is
          // present, x is not the start, and skipping it is what keeps
          // the total work linear.
          if (s.count(x - 1)) continue;
          long long cur = x;
          int len = 1;
          while (s.count(cur + 1)) {
              ++cur;
              ++len;
          }
          best = max(best, len);
      }
      cout << best << endl;
      return 0;
  }
eval_notes: |
  本题的坑在于**答案是"连续整数值"而不是"连续下标"**，
  这一点理解错之后，写出的程序会稳定地给出错误答案，
  且在样例上差异明显。

  第一类错误是**把题目理解成"最长连续子数组"**（下标连续），
  于是对 `100 4 200 1 3 2` 会输出 1（或 2）而不是 4。
  错因标签：misread_problem。

  第二类错误是**排序后统计相邻差为 1 的元素个数，但没有去重**。
  排序后 `5 5 5 5 5` 的相邻差为 0 而非 1，恰好得到 1——正确；
  但 `1 1 2 2 3 3` 会因为重复元素打断计数，得到 3 而不是 3
  （恰好也对）；真正的错误出现在 `1 1 1 2 3` 这类数据上，
  不同实现会得到 2 或 3。正确做法是先用 set 去重。错因标签：
  duplicate_handling。

  第三类错误是**哈希表解法里没有"只从起点开始"的判断**，
  对每个元素都向左向右扩展。答案正确，但复杂度退化为
  $O(n^2)$：$n = 10^5$ 时最坏约 $10^{10}$ 次查找，会超时。
  这是本题最常见、也最能体现"复杂度分析"的错误。
  错因标签：wrong_complexity。

  第四类错误是**用 `unordered_set` 但把 `s.count(x + 1)` 写成
  `s.find(x + 1) != s.end()` 之外的判断**（例如把
  `count` 的结果当成布尔取反），导致方向搞反，统计的是
  递减序列。错因标签：inverted_condition。

  第五类错误是**元素绝对值达 $10^9$ 时用数组下标当哈希**，
  内存爆掉或负下标越界。错因标签：wrong_data_type。

  第六类错误是**把答案初值设为 0 且在没有元素时输出 0**——
  本题 $n \ge 1$，所以初始为 0 也会在循环里被更新成至少 1。
  但若实现里用了"只在扩展成功时更新"，单元素数组会输出 0。
  错因标签：uninitialized_state。
