id: p014-coin-change-greedy
title: 找零钱（最少硬币数）
knowledge_tags:
  - 贪心
  - 动态规划
  - 硬币问题
difficulty: medium
source: 经典算法题
description: |
  给定 $n$ 种硬币的面值与数量不限，以及一个需要找零的金额 $m$，
  求凑出 $m$ 所需的**最少硬币数**。

  如果无论如何都无法凑出 $m$，输出 `-1`。

  **输入格式**

  第一行两个整数 $n$ 和 $m$，以空格分隔。
  第二行 $n$ 个整数，表示每种硬币的面值。

  **输出格式**

  一行，一个整数，表示最少硬币数；无解输出 `-1`。

  **数据范围**

  $1 \le n \le 100$，$0 \le m \le 10^4$，硬币面值 $1 \le v_i \le 10^4$

  **提示**

  面值不保证是倍数关系，例如硬币为 `[1, 3, 4]` 而 $m = 6$ 时，
  贪心取 4 + 1 + 1 需要 3 枚，而最优是 3 + 3 只需 2 枚。
input_format: 第一行 n 和 m，第二行 n 个硬币面值。
output_format: 一行一个整数，最少硬币数，无解输出 -1。
time_limit: 2.0
memory_limit: 256

test_cases:
  - input: "3 6\n1 3 4\n"
    expected_output: "2\n"
    is_sample: true
  - input: "1 5\n2\n"
    expected_output: "-1\n"
    is_sample: true
  - input: "1 0\n5\n"
    expected_output: "0\n"
  - input: "2 11\n1 5\n"
    expected_output: "3\n"
  - input: "3 7\n2 4 6\n"
    expected_output: "-1\n"
  - input: "4 10000\n1 5 10 25\n"
    expected_output: "400\n"
  - input: "3 6\n1 2 5\n"
    expected_output: "2\n"

correct_reference: |
  #include <iostream>
  #include <vector>
  #include <algorithm>
  using namespace std;
  int main() {
      int n, m;
      cin >> n >> m;
      vector<int> v(n);
      for (int i = 0; i < n; ++i) cin >> v[i];
      const int INF = 1e9;
      vector<int> dp(m + 1, INF);
      dp[0] = 0;
      for (int amount = 1; amount <= m; ++amount) {
          for (int i = 0; i < n; ++i) {
              if (v[i] <= amount && dp[amount - v[i]] + 1 < dp[amount]) {
                  dp[amount] = dp[amount - v[i]] + 1;
              }
          }
      }
      cout << (dp[m] >= INF ? -1 : dp[m]) << endl;
      return 0;
  }
eval_notes: |
  本题的核心陷阱是**误用贪心**：每次取面值不超过剩余金额的
  最大硬币。对 `[1, 3, 4]`、m = 6，贪心得到 4 + 1 + 1 = 3 枚，
  而正确答案是 3 + 3 = 2 枚。样例 1 正是为此设计。
  错因标签：greedy_wrong / algorithm_choice。
  另一类错误是 dp 数组初始化成 0 而非无穷大，
  导致无解时输出 0 而不是 -1。错因标签：initialization。
  第三类是忘记 m = 0 应当返回 0。
