id: p013-interval-scheduling
title: 区间调度
knowledge_tags:
  - 贪心
  - 区间
  - 排序
difficulty: medium
source: 经典算法题
description: |
  给定 $n$ 个闭区间 $[l_i, r_i]$，从中选出尽可能多的区间，
  使得任意两个选中的区间都**互不重叠**。

  两个区间 $[l_1, r_1]$ 与 $[l_2, r_2]$ 互不重叠，当且仅当
  $r_1 \le l_2$ 或 $r_2 \le l_1$（端点相接视为不重叠）。

  **输入格式**

  第一行一个整数 $n$。
  接下来 $n$ 行，每行两个整数 $l_i$ 和 $r_i$。

  **输出格式**

  一行，一个整数，表示最多能选出的区间个数。

  **数据范围**

  $1 \le n \le 10^5$，$0 \le l_i \le r_i \le 10^9$
input_format: 第一行 n，接下来 n 行每行 l 和 r。
output_format: 一行一个整数，最多可选区间数。
time_limit: 2.0
memory_limit: 256

test_cases:
  - input: "3\n1 3\n2 4\n3 5\n"
    expected_output: "2\n"
    is_sample: true
  - input: "1\n5 5\n"
    expected_output: "1\n"
    is_sample: true
  - input: "4\n1 2\n2 3\n3 4\n4 5\n"
    expected_output: "4\n"
  - input: "3\n1 10\n1 2\n3 4\n"
    expected_output: "2\n"
  - input: "2\n1 5\n5 9\n"
    expected_output: "2\n"
  - input: "3\n0 0\n0 0\n0 0\n"
    expected_output: "3\n"
  - input: "4\n0 2\n1 3\n3 4\n3 3\n"
    expected_output: "3\n"

correct_reference: |
  #include <iostream>
  #include <vector>
  #include <algorithm>
  using namespace std;
  int main() {
      int n;
      cin >> n;
      vector<pair<long long, long long>> segs(n);
      for (int i = 0; i < n; ++i) cin >> segs[i].first >> segs[i].second;
      // Greedy: always take the interval that ends earliest.
      sort(segs.begin(), segs.end(),
           [](const pair<long long, long long>& a,
              const pair<long long, long long>& b) {
               return a.second < b.second;
           });
      long long last_end = -1;
      int count = 0;
      for (int i = 0; i < n; ++i) {
          if (segs[i].first >= last_end) {
              count++;
              last_end = segs[i].second;
          }
      }
      cout << count << endl;
      return 0;
  }
eval_notes: |
  典型错误是按**左端点**排序而不是右端点。
  这在 `1 2 / 2 3 / 3 4 / 4 5` 这类用例上碰巧正确，
  但 `1 10 / 1 2 / 3 4` 上会先选中 `1 10` 从而只得到 1 个区间，
  正确结果是 2。错因标签：greedy_choice_wrong。
  另一类错误是端点相接时判断写成严格不等 `>` 而非 `>=`，
  导致 `1 2` 与 `2 3` 无法同时选中。错因标签：boundary_condition。
  第三类是最初的 last_end 初始化成 0，在存在 l = 0 的
  区间（如 `0 0`）时漏选。错因标签：initialization。
