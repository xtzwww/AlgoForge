id: p060-binary-tree-inorder
title: 二叉树的中序遍历
knowledge_tags:
  - 树
  - 遍历
  - 栈
difficulty: medium
source: 经典算法题
description: |
  给定一棵二叉树，请输出它的**中序遍历**序列。
  中序遍历的顺序是：左子树 → 根 → 右子树。

  二叉树在输入中这样描述：第一行一个整数 $n$，表示节点个数，
  节点编号为 $1$ 到 $n$，**编号 1 是根**。
  接下来 $n$ 行，第 $i$ 行两个整数 $l_i$ 和 $r_i$，
  表示节点 $i$ 的左孩子和右孩子编号；没有孩子时该值为 $0$。

  **输入格式**

  第一行一个整数 $n$（$1 \le n \le 10^5$）。
  接下来 $n$ 行，每行两个整数 $l_i$、$r_i$。

  **输出格式**

  一行，$n$ 个整数，以空格分隔，表示中序遍历序列。

  **数据范围**

  $1 \le n \le 10^5$，保证输入的是一棵合法的以 1 为根的二叉树
input_format: 第一行 n，接下来 n 行每行 l 和 r（0 表示无孩子）。
output_format: 一行 n 个整数，中序遍历序列。
time_limit: 2.0
memory_limit: 256

test_cases:
  - input: "5\n2 3\n4 5\n0 0\n0 0\n0 0\n"
    expected_output: "4 2 5 1 3\n"
    is_sample: true
  - input: "1\n0 0\n"
    expected_output: "1\n"
    is_sample: true
  - input: "3\n2 3\n0 0\n0 0\n"
    expected_output: "2 1 3\n"
  - input: "4\n2 0\n3 0\n4 0\n0 0\n"
    expected_output: "4 3 2 1\n"
  - input: "4\n0 2\n0 3\n0 4\n0 0\n"
    expected_output: "1 2 3 4\n"
  - input: "5\n2 4\n0 3\n0 0\n0 5\n0 0\n"
    expected_output: "2 3 1 4 5\n"

correct_reference: |
  #include <iostream>
  #include <vector>
  using namespace std;

  int main() {
      ios::sync_with_stdio(false);
      cin.tie(nullptr);
      int n;
      cin >> n;
      vector<int> leftChild(n + 1, 0), rightChild(n + 1, 0);
      for (int i = 1; i <= n; ++i) {
          cin >> leftChild[i] >> rightChild[i];
      }

      // Iterative inorder. A recursive version is shorter but blows the
      // call stack on a chain of 1e5 nodes, and the problem places no
      // bound on the tree's shape.
      vector<int> stk;
      stk.reserve(n);
      vector<int> out;
      out.reserve(n);
      int cur = 1;
      while (cur != 0 || !stk.empty()) {
          // Walk as far left as possible, remembering the path.
          while (cur != 0) {
              stk.push_back(cur);
              cur = leftChild[cur];
          }
          cur = stk.back();
          stk.pop_back();
          out.push_back(cur);          // visit the node here
          cur = rightChild[cur];       // then its right subtree
      }

      for (size_t i = 0; i < out.size(); ++i) {
          if (i) cout << ' ';
          cout << out[i];
      }
      cout << endl;
      return 0;
  }
eval_notes: |
  本题的迭代写法有一个非常经典、且**在多数形状的树上都恰好正确**
  的错误，值得单独说明。

  第一类错误是**把"访问节点"放在第二层 while 之前**，也就是
  "一路向左、边压栈边输出"。这样输出的是**前序**（根在左之前），
  而样例 1 的中序是 `4 2 5 1 3`、前序是 `1 2 4 5 3`，
  差别明显。错因标签：wrong_traversal。

  第二类错误是**弹出后先走右子树、再输出节点**：时序颠倒了
  "左—根—右"的中间那一步。错因标签：wrong_traversal。

  第三类错误是**在弹出时没有把 `leftChild` 标记为已访问**，
  导致同一个节点被重复压栈。正确写法不依赖标记（弹出后
  只走右子树），但如果实现里"弹出后重新从该节点的左子树开始"，
  就会死循环。错因标签：uninitialized_state / infinite_loop。

  第四类错误是**用递归实现**。$n = 10^5$ 的链状树（用例 4、
  5 都是链）会让递归深度达到 $10^5$，直接爆栈，
  表现为运行时错误而非答案错误。错因标签：stack_overflow /
  wrong_complexity。

  第五类错误是**把输入的孩子顺序颠倒**（先读右再读左，
  或存反了）。用例 3（根的两个孩子）会立刻暴露：
  正确答案 `2 1 3`，写反后得到 `3 1 2`。错因标签：
  inverted_condition。
