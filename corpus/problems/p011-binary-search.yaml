id: p011-binary-search
title: 二分查找
knowledge_tags:
  - 二分
  - 数组
difficulty: medium
source: 经典算法题
description: |
  给定一个长度为 $n$ 的**升序**整数数组 $a$ 和一个目标值 $x$，
  找出 $x$ 在数组中的下标（下标从 1 开始）。

  如果数组中有多个 $x$，输出最小的下标；如果 $x$ 不存在，输出 `-1`。

  **输入格式**

  第一行两个整数 $n$ 和 $x$，以空格分隔。
  第二行 $n$ 个升序排列的整数，以空格分隔。

  **输出格式**

  一行，一个整数，表示 $x$ 的最小下标（从 1 开始），不存在则输出 `-1`。

  **数据范围**

  $1 \le n \le 10^5$，数组元素与 $x$ 的绝对值不超过 $10^9$
input_format: 第一行 n 和 x，第二行 n 个升序整数。
output_format: 一行一个整数，x 的最小下标（从 1 开始），不存在输出 -1。
time_limit: 2.0
memory_limit: 256

test_cases:
  - input: "5 3\n1 3 5 7 9\n"
    expected_output: "2\n"
    is_sample: true
  - input: "5 4\n1 3 5 7 9\n"
    expected_output: "-1\n"
    is_sample: true
  - input: "1 1\n1\n"
    expected_output: "1\n"
  - input: "6 3\n1 3 3 3 5 7\n"
    expected_output: "2\n"
  - input: "5 9\n1 3 5 7 9\n"
    expected_output: "5\n"
  - input: "5 1\n1 3 5 7 9\n"
    expected_output: "1\n"

correct_reference: |
  #include <iostream>
  #include <vector>
  using namespace std;
  int main() {
      int n;
      long long x;
      cin >> n >> x;
      vector<long long> a(n);
      for (int i = 0; i < n; ++i) cin >> a[i];
      int lo = 0, hi = n - 1, ans = -1;
      while (lo <= hi) {
          int mid = lo + (hi - lo) / 2;
          if (a[mid] == x) {
              ans = mid;
              hi = mid - 1;      // keep looking left for the smallest index
          } else if (a[mid] < x) {
              lo = mid + 1;
          } else {
              hi = mid - 1;
          }
      }
      cout << (ans == -1 ? -1 : ans + 1) << endl;
      return 0;
  }
eval_notes: |
  本题的经典坑是「找到即可」与「找最小下标」的区别。
  只写 `if (a[mid] == x) { ans = mid; break; }` 的实现在有重复
  元素时可能返回中间那个下标。用例 `1 3 3 3 5 7`（目标 3）暴露
  这一错误：正确答案是 2，直接 break 可能得到 3。
  错因标签：boundary_condition / duplicate_handling。
  另一类错误是边界写成 `while (lo < hi)`，导致单元素数组查不到。
  错因标签：off_by_one。
  第三类是输出下标忘了从 1 开始。
