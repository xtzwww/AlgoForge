id: p022-average-of-list
title: 求平均数
knowledge_tags:
  - 数组
  - 循环
  - 数值计算
difficulty: easy
source: 经典练习题
description: |
  给定 $n$ 个整数，求它们的算术平均数，结果**保留两位小数**输出。

  **输入格式**

  第一行一个整数 $n$。
  第二行 $n$ 个整数 $a_1, a_2, \dots, a_n$，以空格分隔。

  **输出格式**

  一行，一个实数，表示平均数，保留两位小数。

  **数据范围**

  $1 \le n \le 1000$，$1 \le a_i \le 1000$
input_format: 第一行 n，第二行 n 个整数。
output_format: 一行一个保留两位小数的实数。
time_limit: 2.0
memory_limit: 256

test_cases:
  - input: "3\n1 2 3\n"
    expected_output: "2.00\n"
    is_sample: true
  - input: "4\n3 3 3 3\n"
    expected_output: "3.00\n"
    is_sample: true
  - input: "1\n7\n"
    expected_output: "7.00\n"
  - input: "2\n1 2\n"
    expected_output: "1.50\n"
  - input: "3\n1 1 2\n"
    expected_output: "1.33\n"
  - input: "5\n3 3 3 3 4\n"
    expected_output: "3.20\n"
  - input: "7\n1 2 3 4 5 6 7\n"
    expected_output: "4.00\n"
correct_reference: |
  #include <cstdio>
  int main() {
      int n;
      if (scanf("%d", &n) != 1) return 1;
      long long sum = 0;
      for (int i = 0; i < n; ++i) {
          int x;
          if (scanf("%d", &x) != 1) return 1;
          sum += x;
      }
      printf("%.2f\n", (double)sum / n);
      return 0;
  }
eval_notes: |
  最典型的错误是整数除法——写成 `sum / n` 而 sum 与 n 都是 int，
  于是结果向下取整，`1 2` 得到 `1.00` 而不是 `1.50`。

  **这个 bug 只在"总和不能被 n 整除"时暴露**：`1 2 3` 的和是 6、
  `3 3 3 3` 的和是 12，都能整除，错误的程序在这两个样例上输出的
  数值与正确答案**一模一样**（都是 2.00 与 3.00）。
  两个样例被特意选成都能整除，就是为了让这个 bug 躲到隐藏用例
  `1 2`（和 3，不整除）才暴露。错因标签：wrong_data_type。

  第二类错误是精度不足：用 `float` 存 sum 并在累加过程中就丢精度。
  本题 $n \le 1000$、$a_i \le 1000$，最大和 $10^6$，float 尚可；
  但正确做法是整数累加、最后一次转 double。错因标签：wrong_data_type。

  第三类错误是输出格式——直接用 `%d` 输出，或在保留两位小数时
  用了 `%f` 的默认六位而没写 `%.2f`。错因标签：io_format_error。

  第四类是把"保留两位小数"做成了"截断两位小数"，
  在 `1 1 2`（1.33...）上给出 1.33 与正确结果相同，
  但在 `3 3 3 3 4`（3.2，第三位是 0）上无差别、
  在需要进位的值上才会暴露。错因标签：boundary_condition。
