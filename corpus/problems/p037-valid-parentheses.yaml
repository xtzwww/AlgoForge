id: p037-valid-parentheses
title: 括号匹配
knowledge_tags:
  - 栈
  - 字符串
  - 边界处理
difficulty: easy
source: 经典算法题
description: |
  给定一个只包含 `(`、`)`、`[`、`]`、`{`、`}` 六种字符的字符串 $s$，
  判断它是否是**合法的括号序列**。

  合法序列的定义：

  1. 左括号必须用相同类型的右括号闭合；
  2. 左括号必须以正确的顺序闭合；
  3. 空字符串视为合法序列。

  **输入格式**

  一行，一个字符串 $s$（可能为空行）。

  **输出格式**

  合法输出 `YES`，否则输出 `NO`。

  **数据范围**

  字符串长度不超过 $10^5$
input_format: 一行一个字符串（可能为空行）。
output_format: 一行 YES 或 NO。
time_limit: 2.0
memory_limit: 256

test_cases:
  - input: "()[]{}\n"
    expected_output: "YES\n"
    is_sample: true
  - input: "(]\n"
    expected_output: "NO\n"
    is_sample: true
  - input: "(\n"
    expected_output: "NO\n"
  - input: "{[]}\n"
    expected_output: "YES\n"
  - input: "([)]\n"
    expected_output: "NO\n"
  - input: "]\n"
    expected_output: "NO\n"
  - input: "\n"
    expected_output: "YES\n"

correct_reference: |
  #include <iostream>
  #include <string>
  #include <stack>
  using namespace std;
  int main() {
      string s;
      getline(cin, s);

      stack<char> st;
      bool ok = true;
      for (char c : s) {
          if (c == '(' || c == '[' || c == '{') {
              st.push(c);
          } else if (c == ')' || c == ']' || c == '}') {
              // An early closer with nothing to match is the case a
              // "count and compare" solution gets wrong.
              if (st.empty()) {
                  ok = false;
                  break;
              }
              char top = st.top();
              st.pop();
              if ((c == ')' && top != '(') ||
                  (c == ']' && top != '[') ||
                  (c == '}' && top != '{')) {
                  ok = false;
                  break;
              }
          }
      }
      // Leftovers matter just as much as mismatches: "((" must not pass.
      if (!st.empty()) ok = false;
      cout << (ok ? "YES" : "NO") << endl;
      return 0;
  }
eval_notes: |
  本题规则只有两句话，却是"逐条规则都可能漏"的典型，
  而且每一条漏掉的规则都有专门的隐藏用例。

  第一类错误是**读完字符串后没有检查栈是否为空**。
  这类错误对 `(` 和 `((` 这类"只有左括号"的输入给出 YES。
  这是最普遍的一种漏检。错因标签：missing_case。

  第二类错误是**在右括号处没有先判空就 `top()`**：输入以
  `]` 或 `)` 开头时，对空栈取栈顶是未定义行为，可能崩溃、
  可能读到垃圾值、也可能"碰巧"匹配成功输出 YES。
  正确写法是先判 `st.empty()`。错因标签：boundary_condition。

  第三类错误是**只检查左右括号数量是否相等**（统计各种括号
  出现的次数）。这会把 `([)]` 判成合法——它数量完全平衡，
  但嵌套顺序错误。用例 `([)]` 专门覆盖它。错因标签：
  wrong_algorithm。

  第四类错误是**只判断了括号的"层数"而没判断类型**，
  即遇到任意右括号都算匹配上任意左括号，于是 `(]` 判成 YES。
  错因标签：missing_case。

  第五类错误是**用 `cin >> s` 读入**：空行不会进入循环，
  字符串保持为空，输出 YES——恰好是正确答案，所以这条错误
  在空行用例上**不会暴露**；风险在于以空格开头的输入会被
  截断。真正的差别要用含空格的行才能看出。错因标签：
  io_format_error。

  第六类错误是把空字符串当成非法序列，输出 NO。
  用例 `空行` 专门覆盖它。错因标签：misread_problem。
