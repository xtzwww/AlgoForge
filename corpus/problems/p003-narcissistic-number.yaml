id: p003-narcissistic-number
title: 水仙花数
knowledge_tags:
  - 基础语法
  - 数字拆分
  - 枚举
difficulty: easy
source: 经典入门题
description: |
  水仙花数是指一个三位数，其各位数字的立方和等于该数本身。
  例如 $153 = 1^3 + 5^3 + 3^3$。

  给定一个三位数 $n$，判断它是否为水仙花数。

  **输入格式**

  一行，一个三位整数 $n$。

  **输出格式**

  如果 $n$ 是水仙花数，输出 `YES`；否则输出 `NO`。

  **数据范围**

  $100 \le n \le 999$
input_format: 一行一个三位整数 n。
output_format: 是水仙花数输出 YES，否则输出 NO。
time_limit: 2.0
memory_limit: 256

test_cases:
  - input: "153\n"
    expected_output: "YES\n"
    is_sample: true
  - input: "100\n"
    expected_output: "NO\n"
    is_sample: true
  - input: "370\n"
    expected_output: "YES\n"
  - input: "371\n"
    expected_output: "YES\n"
  - input: "407\n"
    expected_output: "YES\n"
  - input: "999\n"
    expected_output: "NO\n"

correct_reference: |
  #include <iostream>
  using namespace std;
  int main() {
      int n;
      cin >> n;
      int a = n / 100;
      int b = n / 10 % 10;
      int c = n % 10;
      if (a * a * a + b * b * b + c * c * c == n) {
          cout << "YES" << endl;
      } else {
          cout << "NO" << endl;
      }
      return 0;
  }
eval_notes: |
  常见错误是用 `n / 10` 取十位而不是 `n / 10 % 10`，
  于是 153 的十位拿到 15 而非 5，立方和巨大，全部判为 NO。
  这类错误在样例 153 上就暴露，属于表达式优先级/取模遗漏。
  错因标签：arithmetic / digit_extraction。
