id: p004-sort-three
title: 三个数排序
knowledge_tags:
  - 基础语法
  - 条件分支
  - 排序
difficulty: easy
source: 经典入门题
description: |
  输入三个整数 $a, b, c$，将它们按从小到大的顺序输出。

  **输入格式**

  一行，三个整数 $a, b, c$，以空格分隔。

  **输出格式**

  一行，三个整数，按从小到大的顺序，以空格分隔。

  **数据范围**

  $-1000 \le a, b, c \le 1000$
input_format: 一行三个整数 a、b、c。
output_format: 一行三个整数，从小到大，空格分隔。
time_limit: 2.0
memory_limit: 256

test_cases:
  - input: "3 1 2\n"
    expected_output: "1 2 3\n"
    is_sample: true
  - input: "2 2 1\n"
    expected_output: "1 2 2\n"
    is_sample: true
  - input: "5 5 5\n"
    expected_output: "5 5 5\n"
  - input: "-1 -5 0\n"
    expected_output: "-5 -1 0\n"
  - input: "1000 -1000 0\n"
    expected_output: "-1000 0 1000\n"

correct_reference: |
  #include <iostream>
  #include <algorithm>
  using namespace std;
  int main() {
      int a[3];
      cin >> a[0] >> a[1] >> a[2];
      sort(a, a + 3);
      cout << a[0] << " " << a[1] << " " << a[2] << endl;
      return 0;
  }
eval_notes: |
  用 if 手工交换时常见的错误是漏掉某两条分支的组合，
  例如只比较了 a 与 b、b 与 c，没有在交换后重新比较 a 与 b，
  导致 `3 1 2` 这类输入输出 `1 3 2`。
  错因标签：missing_case / conditional_logic。
  另一类错误是把相等元素也当作需要交换而写成严格不等，
  好在 `2 2 1` 这类用例下通常仍正确。
