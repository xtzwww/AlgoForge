# ============================================================
# 基于智能体的编程课程学习过程分析与反馈系统 CI
#
# 目的：把「记得跑的时候才跑」的校验变成每次推送都跑，作为升级改造期的安全网。
#
# 三条硬约束，改这个文件前先读：
#
#   1. **绝不跑 eval_set。** 那批会真的请求付费 LLM 端点，既计费又不可
#      复现（README「测试」一节有说明）。所以这里的 pytest 永远带
#      `-m "not eval_set"`。
#   2. **不需要 PostgreSQL。** 测试通过 monkeypatch 把 `get_session` 换成
#      内存 SQLite（`StaticPool`），所以 runner 上不用起数据库服务。
#   3. **前端有单元测试了**（2026-09-19 接入 Vitest，`npm run test`）。但目前
#      只覆盖 api 层的纯逻辑与判题流的事件时序——**环境是 node，没有 jsdom**，
#      所以还没有真正的组件测试。要加组件测试，先装 jsdom 并在
#      `vitest.config.ts` 里配环境，不要把现有测试一起拖进 DOM 环境。
#
# ⚠️ 本文件是**照着本机实测结果**写的，但从未在 GitHub Actions 上真跑过
# （本机没有 CI 环境）。第一次推上去若变红，先看是哪一步，不要直接删。
# ============================================================
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时，取消上一次还没跑完的，省 runner 分钟数。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（ruff + 迁移 + pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与 sidecar/.venv 一致。AGENTS.md 要求 3.11+；`StrEnum` 也是 3.11+
          # （`app/agent/schemas.py` 与 `app/sandbox/judge.py` 都用它）。
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r sidecar/requirements.txt
          # ruff 是开发工具，故意不在 requirements.txt 里（那是运行时依赖）。
          pip install ruff

      - name: 打印工具链
        # 判题沙箱会真的编译 C++，g++ 缺失时失败信息很难懂，先打出来。
        run: |
          python -V
          g++ --version | head -1

      - name: Ruff
        run: ruff check .

      - name: 迁移可执行性（空库 SQLite）
        # 只证明「迁移能从头执行到 head」（空 SQLite）。真 PostgreSQL 上的行为
        # 由下面的 postgres job 覆盖；本机也能用 `tools/pg_verify.sh` 直接验。
        working-directory: sidecar
        run: |
          python -m alembic -x db_url=sqlite:///${{ runner.temp }}/algoforge-ci.sqlite upgrade head

      - name: pytest（排除 eval_set）
        run: python -m pytest -q -m "not eval_set"

  frontend:
    name: 前端（tsc + vue-tsc + ESLint）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装依赖
        # `--ignore-scripts` 跳过 electron-builder 的 postinstall（它要下载
        # Electron 二进制，类型检查和 lint 都用不到）。
        run: npm ci --ignore-scripts

      - name: 类型检查（主进程 / 构建配置）
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.node.json --composite false

      - name: 类型检查（渲染进程）
        run: ./node_modules/.bin/vue-tsc --noEmit -p tsconfig.web.json --composite false

      - name: ESLint
        run: ./node_modules/.bin/eslint src --no-cache

      - name: Vitest（前端单元测试）
        # 判题流那条时序测试是有来历的：客户端曾把 `judge_done` 当成「流结束」
        # 直接关掉 WebSocket，而智能体分析的事件走同一条连接，于是 WA 之后
        # 永远看不到错因。现在由 `judge_done.analysing` 决定何时关，这里钉住它。
        run: ./node_modules/.bin/vitest run

  postgres:
    name: 真实 PostgreSQL（迁移 + 聚合 SQL）
    runs-on: ubuntu-latest
    # 它为什么必须存在：`compute_knowledge_stats` 和题库的知识点筛选曾用了
    # `func.json_each`，而展开 JSON 数组在两种库上写法不同。全部测试都跑在
    # SQLite 上（conftest 把 get_session 换成内存库），所以这类 bug 在「画像页」
    # 和「题库标签筛选」上活到了被人读代码发现为止。
    #
    # ⚠️ 2026-09-19 更新：本机**已经有真 PostgreSQL 了**（zip 版 17.6，
    # 见 `tools/pg_verify.sh`），迁移与聚合 SQL 已在本机真 PG 上跑绿。这里因此
    # 不再是「唯一能碰到真 PG 的地方」，而是在干净环境里每次自动验一遍。
    #
    # `continue-on-error` 先留着：这个 workflow **从未在任何 CI 平台真跑过**——
    # 远端是 Gitee，而 Gitee 不执行 `.github/workflows/`。所以第一次它真的跑起来
    # 之前，红色既可能是真问题也可能是配置问题，别急着删它。
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: algoforge
          POSTGRES_PASSWORD: algoforge
          POSTGRES_DB: algoforge
        ports:
          - 5432:5432
        # 不健康检查的话，迁移会赶在服务器 accept 连接之前开始。
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 聚合测试用它建 engine（见 tests/test_postgres_aggregation.py）。
      ALGOFORGE_PG_TEST_URL: postgresql+psycopg://algoforge:algoforge@localhost:5432/algoforge
      # 迁移用它；app/db.py 会把 asyncpg 改写成 psycopg 同步驱动。
      DATABASE_URL: postgresql+asyncpg://algoforge:algoforge@localhost:5432/algoforge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r sidecar/requirements.txt

      - name: 迁移到 head（真实 PostgreSQL，不是 SQLite）
        # docs/项目欠缺清单.md §5.2：PU-11 / PU-13 的迁移只在本机 SQLite 上
        # 验过，而 SQLite 用 batch_alter_table 能过不代表 PG 上能过。
        working-directory: sidecar
        run: python -m alembic upgrade head

      - name: 聚合 SQL 跑在真实 PostgreSQL 上
        run: python -m pytest tests/test_postgres_aggregation.py -q
