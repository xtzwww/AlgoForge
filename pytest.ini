[pytest]
testpaths = tests
markers =
    eval_set: compiles and runs C++ for every S2 evaluation case (slow)

# The ORM model for a judge test case is literally called ``TestCase``
# (see sidecar/app/models/test_case.py), and pytest's default collection
# rule picks up any class whose name starts with "Test". Any test module
# that imports the model therefore triggers PytestCollectionWarning —
# "cannot collect test class 'TestCase' because it has a __init__
# constructor" — from an object that was never meant to be collected.
#
# The name is correct on the model side (it is a test case), so the rule
# is adjusted here rather than renaming the domain concept to satisfy the
# test runner. This does not weaken collection of real tests: the project
# convention is function-style tests named ``test_*``, none of which
# match this pattern.
python_classes = Test*Suite

# Keep the warning visible as an error in a strict run so a genuine future
# collision is not silently swallowed along with this known one.
filterwarnings =
    default
